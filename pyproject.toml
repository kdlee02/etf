[project]
name = "etf-agent"
version = "0.1.0"
description = "ETF 투자 리서치 어시스턴트 (MVP: structured path)"
requires-python = ">=3.11,<3.14"  # tokenizers(langchain-upstage)가 3.14 wheel 없음 → 3.13 이하 강제
dependencies = [
    "yfinance>=1.5,<2",
    "streamlit>=1.40",
    "plotly>=5.24",
    "openai>=2.46.0",
    "pdfplumber>=0.11.10",
    "faiss-cpu>=1.14.3",
    "langchain-upstage>=0.7.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "certifi>=2026.6.17",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etf_agent"]
